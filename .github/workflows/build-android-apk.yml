name: Build Android APK + AAB

# Builds:
# 1. Debug APK for direct installation/testing
# 2. Signed Release AAB for Google Play
#
# APK is published to rolling "latest" GitHub Release.
# AAB is available as a GitHub Actions artifact.

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Node / Web build
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_ROOM_SERVER_URL: ${{ vars.VITE_ROOM_SERVER_URL }}
        run: npm run build

      # ---------------------------------------------------------
      # Java / Android
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ---------------------------------------------------------
      # Capacitor
      # ---------------------------------------------------------
      - name: Sync web build into Android
        run: npx cap sync android

      # ---------------------------------------------------------
      # DEBUG APK
      # ---------------------------------------------------------
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk shasn.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shasn-android-apk
          path: shasn.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # RESTORE RELEASE KEYSTORE
      # ---------------------------------------------------------
      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      # ---------------------------------------------------------
      # RELEASE AAB
      # ---------------------------------------------------------
      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Rename AAB
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab shasn.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: shasn-google-play-aab
          path: shasn.aab
          if-no-files-found: error

      # ---------------------------------------------------------
      # GITHUB LATEST RELEASE
      # ---------------------------------------------------------
      - name: Publish APK to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest shasn.apk \
            --title "SHASN — latest Android build" \
            --notes "Latest APK, built automatically from commit ${{ github.sha }}. Download shasn.apk below and sideload it on Android."