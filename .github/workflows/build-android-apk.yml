name: Build Android APK + AAB

# Builds:
# 1. Signed release APK for direct installation/testing
# 2. Signed release AAB for Google Play
#
# APK is published to rolling "latest" GitHub Release.
# AAB is available as a GitHub Actions artifact.

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Node / Web build
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_ROOM_SERVER_URL: ${{ vars.VITE_ROOM_SERVER_URL }}
        run: npm run build

      # ---------------------------------------------------------
      # Java / Android
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ---------------------------------------------------------
      # Capacitor
      # ---------------------------------------------------------
      - name: Sync web build into Android
        run: npx cap sync android

      # ---------------------------------------------------------
      # RELEASE SIGNING
      # ---------------------------------------------------------
      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing secret: ANDROID_KEY_ALIAS"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      # ---------------------------------------------------------
      # SIGNED RELEASE APK + AAB
      # ---------------------------------------------------------
      - name: Build signed release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect signed artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk shasn.apk
          cp android/app/build/outputs/bundle/release/app-release.aab shasn.aab
          cp android/app/build/outputs/mapping/release/mapping.txt shasn-mapping.txt

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER" || { echo "apksigner was not found at $APKSIGNER"; find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name 'apksigner*' -print; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs shasn.apk

      - name: Verify AAB signature
        run: |
          verification_output="$(jarsigner -verify -verbose -certs shasn.aab 2>&1)"
          printf '%s\n' "$verification_output"
          printf '%s\n' "$verification_output" | grep -q 'jar verified\.' || { echo "AAB signature verification failed"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shasn-android-apk
          path: shasn.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: shasn-google-play-aab
          path: |
            shasn.aab
            shasn-mapping.txt
          if-no-files-found: error

      # ---------------------------------------------------------
      # GITHUB LATEST RELEASE
      # ---------------------------------------------------------
      - name: Publish APK to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest shasn.apk \
            --title "SHASN — latest Android build" \
            --notes "Latest APK, built automatically from commit ${{ github.sha }}. Download shasn.apk below and sideload it on Android."
